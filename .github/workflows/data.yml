name: Refresh database
on:
  schedule:
    - cron: "17 4 3 * *"   # monthly, day 3, 04:17 UTC
  workflow_dispatch:
    inputs:
      castings_from:
        description: 'Read series and casting pages (the only source of colours) from this year onwards. 2010 takes about 1.5-2 h, 1968 takes longer.'
        default: '2010'
        required: true
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build dataset (fails instead of publishing broken data)
        # Phase 1 reads the yearly lists, phase 2 reads each casting page for colours.
        # A scheduled run uses 2010; see docs/TODO.md about one full 1968-onwards run.
        run: npm run data -- --castings-from "${{ inputs.castings_from || '2010' }}"
        timeout-minutes: 330
      - id: commit
        run: |
          git config user.name "car-collection-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No data changes."
          else
            git commit -m "Update database"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
